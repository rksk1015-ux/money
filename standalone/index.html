<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오이 머니 플래닛 - 초등 학급 경제 스톡&뱅킹</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 헤더 (날짜 미표시) -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">🥒</div>
      <div class="brand-title">
        <span class="brand-badge">초등 학급 경제</span>
        <h1>오이 머니 플래닛</h1>
      </div>
    </div>

    <div class="header-user">
      <span id="student-avatar-header" style="font-size:1.4rem;">🥒</span>
      <span id="student-name-header" style="font-weight:700;">김민준</span>
    </div>

    <div class="header-actions">
      <button class="btn-header" style="background:#0f766e; color:white;" onclick="alert('구글 스프레드시트 Apps Script 연동을 준비 중입니다. Web App URL을 설정한 후 시트 데이터를 불러올 수 있습니다.')">🔄 시트 불러오기</button>
      <button class="btn-header" style="background:#065f46; color:white;" onclick="alert('현재 학생 자산 및 통장 데이터를 구글 시트에 저장하는 기능입니다. Apps Script URL을 연동해 주세요.')">💾 시트에 결과 저장</button>
      <button class="btn-header" onclick="alert('React 앱 메인 화면에서 정밀한 은행 창구 및 학생 PIN 인증을 이용하실 수 있습니다.')">🏦 은행 창구</button>
      <button class="btn-header admin" onclick="alert('React 앱 메인 화면에서 선생님 관리 콘솔을 이용하실 수 있습니다.')">🛠️ 선생님 관리</button>
    </div>
  </header>

  <div class="container">
    
    <!-- 3대 지갑 분리 카드 -->
    <div class="wallets-grid">
      <div class="wallet-card wallet-cash">
        <div class="wallet-top">
          <span>👛 현금 지갑</span>
          <span style="font-size:0.75rem; background:rgba(255,255,255,0.25); padding:2px 8px; border-radius:99px;">즉시 사용</span>
        </div>
        <div class="wallet-amount"><span id="cash-amount">0</span><span class="wallet-unit">오이</span></div>
        <p style="font-size:0.75rem; opacity:0.9; margin-top:4px;">교실 매점, 간식, 활동에 자유롭게 씁니다.</p>
      </div>

      <div class="wallet-card wallet-savings">
        <div class="wallet-top">
          <span>🐷 저금통 (예금)</span>
          <span style="font-size:0.75rem; background:rgba(255,255,255,0.25); padding:2px 8px; border-radius:99px;">이자 3.0%</span>
        </div>
        <div class="wallet-amount"><span id="savings-amount">0</span><span class="wallet-unit">오이</span></div>
        <p style="font-size:0.75rem; opacity:0.9; margin-top:4px;">이자가 붙는 안전 자산입니다.</p>
      </div>

      <div class="wallet-card wallet-invest">
        <div class="wallet-top">
          <span>📈 투자 계좌</span>
          <span style="font-size:0.75rem; background:rgba(255,255,255,0.25); padding:2px 8px; border-radius:99px;">주식 예수금</span>
        </div>
        <div class="wallet-amount"><span id="invest-amount">0</span><span class="wallet-unit">오이</span></div>
        <p style="font-size:0.75rem; opacity:0.9; margin-top:4px;">4대 가상 기업 주식을 매매하는 자금입니다.</p>
      </div>
    </div>

    <!-- 이체하기 버튼 -->
    <div style="margin-bottom:1.5rem; text-align:right;">
      <button onclick="openTransferModal()" style="background:#0f172a; color:white; border:none; padding:10px 18px; border-radius:12px; font-weight:700; cursor:pointer;">
        ⇄ 지갑 간 이체하기
      </button>
    </div>

    <!-- 탭 네비게이션 -->
    <div class="tab-nav">
      <button id="tab-btn-market" class="tab-btn active" onclick="switchTab('market')">📈 주식 시장</button>
      <button id="tab-btn-passbook" class="tab-btn" onclick="switchTab('passbook')">📗 My 통장 내역</button>
    </div>

    <!-- 탭 1: 주식 시장 -->
    <div id="content-market" class="tab-content">
      <div id="stock-list" class="stock-grid"></div>
    </div>

    <!-- 탭 2: 통장 내역 -->
    <div id="content-passbook" class="tab-content" style="display:none;">
      <div class="card-white">
        <h3 style="font-weight:800; margin-bottom:12px;">📗 최근 거래 기록</h3>
        <div id="tx-list"></div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
